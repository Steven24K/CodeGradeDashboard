name: Validate Vercel branch

on:
  push:
    branches: ["vibe-code"]
  pull_request:
    branches: ["vibe-code"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build Next.js app
        run: yarn build
